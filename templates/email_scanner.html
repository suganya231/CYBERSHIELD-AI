<!DOCTYPE html><html><head><style>body{background:#050a14;color:#fff;font-family:sans-serif;margin:0}nav{padding:15px 30px;background:#020610;display:flex;justify-content:space-between}.box{max-width:800px;margin:30px auto;background:#0a1428;border:1px solid #1e3a5f;border-radius:15px;padding:30px;text-align:center}textarea{width:100%;height:120px;padding:12px;background:#020610;border:1px solid #fc0;border-radius:10px;color:#fff}button{width:100%;padding:14px;margin-top:15px;background:linear-gradient(90deg,#fc0,#f80);border:none;border-radius:10px;color:#000;font-weight:bold}.res{margin-top:20px;text-align:left;padding:20px;border-radius:12px}.safe{background:#052e16;border:2px solid #0f8}.high{background:#3b0a0a;border:2px solid #f44}.mid{background:#3b2f05;border:2px solid #fc0}.r{background:rgba(0,0,0,0.4);padding:7px;margin:5px 0;border-radius:6px;font-size:13px}</style></head><body><nav><div>📧 EMAIL</div><a href="/" style="color:#fff;text-decoration:none;border:1px solid #555;padding:7px 15px;border-radius:20px">← Back</a></nav><div class="box"><h2>📧 EMAIL DETECTOR</h2><form method="POST" action="/check_email"><textarea name="email_text" placeholder="Email paste pannu" required>{{ email_text if email_text else '' }}</textarea><button>SCAN</button></form>{% if email_result %}<div class="res {% if email_risk=='LOW' %}safe{% elif email_risk=='MEDIUM' %}mid{% else %}high{% endif %}"><h3>{{ email_status }} - {{ email_prob }}%</h3>{% for re in email_words %}<div class="r">⚠️ {{ re }}</div>{% endfor %}</div>{% endif %}</div></body></html>
