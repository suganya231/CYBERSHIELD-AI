<!DOCTYPE html><html><head><style>body{background:#050a14;color:#fff;font-family:sans-serif;margin:0}nav{padding:15px 30px;background:#020610;display:flex;justify-content:space-between}.box{max-width:700px;margin:30px auto;background:#0a1428;border:1px solid #1e3a5f;border-radius:15px;padding:30px;text-align:center}input{width:100%;padding:14px;background:#020610;border:1px solid #00eaff;border-radius:10px;color:#fff}button{width:100%;padding:14px;margin-top:15px;background:linear-gradient(90deg,#00ccff,#a020f0);border:none;border-radius:10px;color:#fff;font-weight:bold}.res{margin-top:20px;text-align:left;padding:20px;border-radius:12px}.bad{background:#3b0a0a;border:2px solid #f44}.good{background:#052e16;border:2px solid #0f8}.mid{background:#3b2f05;border:2px solid #fc0}.r{background:rgba(0,0,0,0.4);padding:7px;margin:5px 0;border-radius:6px;font-size:13px}</style></head><body><nav><div>🔐 PASSWORD</div><a href="/" style="color:#fff;text-decoration:none;border:1px solid #555;padding:7px 15px;border-radius:20px">← Back</a></nav><div class="box"><h2>🔐 PASSWORD ANALYZER</h2><form method="POST" action="/check_password"><input type="text" name="password" placeholder="Password" required><button>ANALYZE</button></form>{% if pwd_result %}<div class="res {% if score<40 %}bad{% elif score<75 %}mid{% else %}good{% endif %}"><h3>{{ strength }} - {{ score }}/100</h3><p>Entropy: {{ entropy }} bits | Crack: {{ crack_time }}</p>{% for s in suggestions %}<div class="r">⚠️ {{ s }}</div>{% endfor %}</div>{% endif %}</div></body></html>
